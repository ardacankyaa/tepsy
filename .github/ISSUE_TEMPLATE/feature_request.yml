name: Feature request
description: Suggest a restaurant workflow improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: Restaurant workflow
      description: Who needs this, and what task is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe how the completed workflow should behave.
    validations:
      required: true
