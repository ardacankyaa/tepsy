name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:release
        env:
          TEPSY_BROWSER: chromium
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run release:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tepsy-source-release
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: tepsy-test-results
          include-hidden-files: true
          path: |
            .tepsy/qa/integration-*/results.json
            .tepsy/qa/release-*/verification.json
            .tepsy/qa/integration-*/browser-results.json
            .tepsy/qa/integration-*/fixtures/*-results.json
          retention-days: 7

  managed-install:
    name: Fresh demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run test:managed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: managed-install-${{ matrix.os }}
          include-hidden-files: true
          path: .tepsy/qa/managed-demo-*/*.log
          retention-days: 7
